name: Check scaffold
on: [push, pull_request]
permissions:
  contents: read
jobs:
  # One classifier for the whole workflow. Job-level if skips report a finished
  # check; a workflow-level paths filter would leave a required check pending.
  # Pushes to the default branch force every job below.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      console_browser: ${{ steps.filter.outputs.console_browser }}
      windows_check: ${{ steps.filter.outputs.windows_check }}
      project_automation: ${{ steps.filter.outputs.project_automation }}
      check: ${{ steps.filter.outputs.check }}
      tailcat_lab: ${{ steps.filter.outputs.tailcat_lab }}
      relay_fallback: ${{ steps.filter.outputs.relay_fallback }}
      database: ${{ steps.filter.outputs.database }}
      dataset_reproduction: ${{ steps.filter.outputs.dataset_reproduction }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        env:
          CI_WORKFLOW: check
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_REF: ${{ github.ref }}
          CI_SHA: ${{ github.sha }}
          CI_BEFORE: ${{ github.event.before }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CI_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 -u tools/ci/path_filters.py
  console-browser:
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.console_browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
        working-directory: apps/web-console
      - run: npx playwright-core install --with-deps chromium
        working-directory: apps/web-console
      - name: Locate the pinned Chromium browser
        working-directory: apps/web-console
        run: node -e 'console.log("BROWSER_PATH=" + require("playwright-core").chromium.executablePath())' >> "$GITHUB_ENV"
      - run: make browser-check
      - name: Save console browser screenshots
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: console-browser
          path: artifacts/console/
          if-no-files-found: warn
          retention-days: 14
  windows-check:
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.windows_check == 'true'
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r models/test-requirements.txt
      - name: Native Windows checks and probe failure tests
        shell: pwsh
        run: ./tools/check-windows.ps1
      - name: Save synthetic collector-budget evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: collector-budget-windows-ci
          path: artifacts/collector-budget/windows-ci.json
          if-no-files-found: warn
          retention-days: 14
      - name: Save sensor availability evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: sensor-availability-windows-ci
          path: artifacts/sensors/windows-ci.json
          if-no-files-found: warn
          retention-days: 14
  project-automation:
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.project_automation == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: node --test tools/project-sync.test.mjs
  check:
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.check == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r models/test-requirements.txt
      - name: Check shared contract conformance
        run: make contract-check
      - name: Run deterministic controller fixture scenarios
        run: |
          mkdir -p artifacts/fakes
          go run ./tools/fakes/controllerfake --scenario all | tee artifacts/fakes/controller-fake-report.json
      - run: make check cross-build demo
      - name: Assert endpoint replay against contract fake and actual scaffold
        run: make replay-check
      - name: Save contract conformance evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: contract-conformance
          path: artifacts/contracts/conformance-v1-report.json
          if-no-files-found: warn
          retention-days: 14
      - name: Save controller fixture evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: controller-fixture
          path: artifacts/fakes/controller-fake-report.json
          if-no-files-found: warn
          retention-days: 14
  tailcat-lab:
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.tailcat_lab == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: networking/tailcat-lab/go.mod
          cache: false
      - name: Verify pinned Tailcat and direct UDP restart proof
        run: make tailcat-lab-check
  relay-fallback:
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.relay_fallback == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Install namespace tools
        run: sudo apt-get update && sudo apt-get install -y nftables iproute2 util-linux
      - name: Allow unprivileged user namespaces on this ephemeral runner
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Application mesh through the scoped relay with all UDP dropped
        run: make relay-fallback-proof
  database:
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.database == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: device_audit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Apply and verify PostgreSQL migrations
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/device_audit_test?sslmode=disable
        run: make database-check
      - name: Relay restart, controller restart and long-partition recovery
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/device_audit_test?sslmode=disable
        run: make recovery-proof
  dataset-reproduction:
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.dataset_reproduction == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download the pinned public Backblaze archive
        run: >-
          curl --fail --location --retry 3
          --output "$RUNNER_TEMP/backblaze-2013.zip"
          https://f001.backblazeb2.com/file/Backblaze-Hard-Drive-Data/data_2013.zip
      - name: Reproduce real-source partition manifests
        env:
          PYTHONPATH: models/src
        run: >-
          python -m device_audit_models.partitions
          --archive "$RUNNER_TEMP/backblaze-2013.zip"
          --policy models/datasets/backblaze-2013/policy.json
          --verify models/datasets/backblaze-2013/partitions.json
