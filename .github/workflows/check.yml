name: Check scaffold
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows-check:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r models/test-requirements.txt
      - name: Native Windows checks and probe failure tests
        shell: pwsh
        run: ./tools/check-windows.ps1
  project-automation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: node --test tools/project-sync.test.mjs
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r models/test-requirements.txt
      - name: Check shared contract conformance
        run: make contract-check
      - name: Run deterministic controller fixture scenarios
        run: |
          mkdir -p artifacts/fakes
          go run ./tools/fakes/controllerfake --scenario all | tee artifacts/fakes/controller-fake-report.json
      - run: make check cross-build demo
      - name: Assert endpoint replay against contract fake and actual scaffold
        run: make replay-check
      - name: Save contract conformance evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: contract-conformance
          path: artifacts/contracts/conformance-v1-report.json
          if-no-files-found: warn
          retention-days: 14
      - name: Save controller fixture evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: controller-fixture
          path: artifacts/fakes/controller-fake-report.json
          if-no-files-found: warn
          retention-days: 14
  tailcat-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: networking/tailcat-lab/go.mod
          cache: false
      - name: Verify pinned Tailcat and direct UDP restart proof
        run: make tailcat-lab-check
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: device_audit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Apply and verify PostgreSQL migrations
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/device_audit_test?sslmode=disable
        run: make database-check
  dataset-reproduction:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download the pinned public Backblaze archive
        run: >-
          curl --fail --location --retry 3
          --output "$RUNNER_TEMP/backblaze-2013.zip"
          https://f001.backblazeb2.com/file/Backblaze-Hard-Drive-Data/data_2013.zip
      - name: Reproduce real-source partition manifests
        env:
          PYTHONPATH: models/src
        run: >-
          python -m device_audit_models.partitions
          --archive "$RUNNER_TEMP/backblaze-2013.zip"
          --policy models/datasets/backblaze-2013/policy.json
          --verify models/datasets/backblaze-2013/partitions.json
