name: Windows service token budget
on:
  workflow_dispatch:
    inputs:
      samples:
        description: Sweeps per 15s and 60s cadence
        required: false
        default: "30"
  # workflow_dispatch is registered only after this file is on the default
  # branch. The heavy job is gated by the changes output so a push that does
  # not touch it still reports a completed check.
  push:
permissions:
  contents: read
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      service_token_budget: ${{ steps.filter.outputs.service_token_budget }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        env:
          CI_WORKFLOW: service-budget
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_REF: ${{ github.ref }}
          CI_SHA: ${{ github.sha }}
          CI_BEFORE: ${{ github.event.before }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CI_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 -u tools/ci/path_filters.py
  service-token-budget:
    needs: changes
    if: needs.changes.result == 'success' && (github.event_name == 'workflow_dispatch' || (github.ref != 'refs/heads/main' && needs.changes.outputs.service_token_budget == 'true'))
    runs-on: windows-2025
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Measure LocalService and denied-token cadences
        shell: pwsh
        env:
          BUDGET_SAMPLES: ${{ inputs.samples }}
        run: |
          $samples = 30
          if ($env:BUDGET_SAMPLES -match '^[0-9]+$') { $samples = [int]$env:BUDGET_SAMPLES }
          elseif (Test-Path -LiteralPath tools/probes/service-budget.trigger) {
            $raw = (Get-Content -LiteralPath tools/probes/service-budget.trigger -Raw).Trim()
            if ($raw -match '^[0-9]+$') { $samples = [int]$raw }
          }
          ./tools/probes/Invoke-ServiceTokenBudget.ps1 -Samples $samples
      - name: Upload service-token measurements
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: service-token-budget
          path: artifacts/service-budget/
          if-no-files-found: warn
          retention-days: 14
