name: Reconcile project 7

on:
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled, assigned, unassigned, milestoned, demilestoned, transferred]
  # Runs trusted default-branch code, never the PR branch or its dependencies.
  pull_request_target:
    types: [opened, edited, closed, reopened, ready_for_review, converted_to_draft, labeled, unlabeled, assigned, unassigned, milestoned, demilestoned]
  push:
    branches: [main]
    paths: [tools/project-sync.mjs, .github/workflows/project-sync.yml]
  # Native dependency edits and project drags have no matching Actions trigger.
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      apply:
        description: Apply the plan (false only previews it)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: device-audit-project-7
  cancel-in-progress: false

jobs:
  reconcile:
    # Activation is explicit; credentials are never copied from a developer login.
    if: vars.PROJECT_AUTOMATION_ENABLED == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Check automation credentials
        env:
          APP_ID: ${{ vars.PROJECT_AUTOMATION_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.PROJECT_AUTOMATION_APP_PRIVATE_KEY }}
          LEGACY_TOKEN: ${{ secrets.PROJECT_AUTOMATION_TOKEN }}
        shell: bash
        run: |
          if [ -n "$APP_ID" ]; then
            if [ -z "$APP_PRIVATE_KEY" ]; then
              echo '::error::Set PROJECT_AUTOMATION_APP_PRIVATE_KEY for the configured GitHub App.'
              exit 1
            fi
          elif [ -n "$APP_PRIVATE_KEY" ]; then
            echo '::error::Set PROJECT_AUTOMATION_APP_ID for the configured private key.'
            exit 1
          elif [ -z "$LEGACY_TOKEN" ]; then
            echo '::error::Configure the GitHub App as documented in docs/project-automation.md.'
            exit 1
          fi
      - name: Create scoped installation token
        if: vars.PROJECT_AUTOMATION_APP_ID != ''
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.PROJECT_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.PROJECT_AUTOMATION_APP_PRIVATE_KEY }}
          owner: i-got-this-faa
          repositories: device-audit
          permission-issues: write
          permission-pull-requests: write
          permission-organization-projects: write
      - name: Reconcile trusted metadata
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.PROJECT_AUTOMATION_TOKEN }}
          APPLY: ${{ github.event_name != 'workflow_dispatch' || inputs.apply }}
        shell: bash
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo '::error::No automation token was produced; check docs/project-automation.md.'
            exit 1
          fi
          args=(--output "$RUNNER_TEMP/project-plan.json")
          if [ "$APPLY" = true ]; then args+=(--apply); fi
          node tools/project-sync.mjs "${args[@]}"
      - name: Save reconciliation proof
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: project-7-plan
          path: ${{ runner.temp }}/project-plan.json
          if-no-files-found: ignore
          retention-days: 14
